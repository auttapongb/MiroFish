    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Legacy /mirofish/ prefix (stale redirect bug) -> strip prefix to bare path
    location /mirofish/ {
        rewrite ^/mirofish/(.*)$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }


}
