# mirofish.cfoth.ai — HTTP for Cloudflare proxy + HTTPS for direct access
server {
    if ($host = mirofish.cfoth.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mirofish.sasin.cfoth.ai mirofish.cfoth.ai;

    # When accessed directly (not via Cloudflare), redirect to HTTPS
    # But Cloudflare proxy uses HTTP to origin with Flexible SSL
    root /var/www/mirofish;
    index index.html;

    client_max_body_size 50M;

    # Backend API
    # Rate-limited: expensive mutation endpoints (prevent cost abuse)
    location ~ ^/api/(simulation/create|simulation/start|simulation/prepare|simulation/generate-profiles|simulation/interview|report/generate|graph/ontology/generate|graph/build) {
        limit_req zone=mirofish_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    # Legacy /mirofish/ prefix (stale redirect bug) -> strip prefix to bare path
    location /mirofish/ {
        rewrite ^/mirofish/(.*)$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }


}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mirofish.sasin.cfoth.ai mirofish.cfoth.ai;
    ssl_certificate /etc/letsencrypt/live/mirofish.cfoth.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mirofish.cfoth.ai/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/mirofish;
    index index.html;

    client_max_body_size 50M;

    # Rate-limited: expensive mutation endpoints (prevent cost abuse)
